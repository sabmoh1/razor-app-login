<!DOCTYPE html>

<html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>لوحة الأدمن - NASSERUSDT</title> <script src="https://cdn.tailwindcss.com"></script> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"> <style> * { font-family: 'Tajawal', sans-serif; } body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; } .neon-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); } .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3); } </style> </head> <body class="text-white p-4"> <!-- Login View --> <div id="login-view" class="min-h-screen flex items-center justify-center"> <div class="bg-gray-800/80 backdrop-blur-xl rounded-3xl p-8 w-full max-w-md neon-glow"> <div class="text-center mb-8"> <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-4 border-blue-500 mb-4"> <img src="https://i.postimg.cc/gjCsyq9G/photo-2025-11-28-21-43-52.jpg" class="w-full h-full object-cover"> </div> <h1 class="text-3xl font-bold text-blue-500">لوحة الأدمن</h1> </div> <div class="mb-6"> <label class="block text-gray-400 mb-2">كلمة المرور</label> <input type="password" id="admin-password" class="w-full p-4 rounded-xl bg-gray-900 border-2 border-gray-700 focus:border-blue-500" placeholder="أدخل كلمة المرور"> </div> <button onclick="login()" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-500 to-purple-600 font-bold text-lg hover:opacity-90"> <i class="fas fa-sign-in-alt ml-2"></i> دخول </button> <p id="error-msg" class="text-red-500 text-center mt-4 hidden">كلمة المرور خاطئة</p> </div> </div>
<!-- Dashboard View -->
<div id="dashboard-view" class="hidden">
    <header class="flex justify-between items-center mb-8 p-4 bg-gray-800/50 rounded-2xl">
        <h1 class="text-2xl font-bold text-blue-500"><i class="fas fa-shield-alt ml-2"></i>لوحة التحكم</h1>
        <button onclick="logout()" class="px-4 py-2 bg-red-600 rounded-lg hover:bg-red-700">
            <i class="fas fa-sign-out-alt ml-1"></i> خروج
        </button>
    </header>

    <!-- Search -->
    <div class="mb-6">
        <div class="relative">
            <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="search-input" onkeyup="filterUsers()" class="w-full p-4 pr-12 rounded-xl bg-gray-800 border-2 border-gray-700 focus:border-blue-500" placeholder="ابحث بمعرف المستخدم...">
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gray-800 rounded-2xl p-6 text-center">
            <div class="text-3xl font-bold text-blue-500" id="total-users">0</div>
            <div class="text-gray-400">إجمالي المستخدمين</div>
        </div>
        <div class="bg-gray-800 rounded-2xl p-6 text-center">
            <div class="text-3xl font-bold text-green-500" id="active-users">0</div>
            <div class="text-gray-400">مفعّل</div>
        </div>
        <div class="bg-gray-800 rounded-2xl p-6 text-center">
            <div class="text-3xl font-bold text-red-500" id="inactive-users">0</div>
            <div class="text-gray-400">غير مفعّل</div>
        </div>
        <div class="bg-gray-800 rounded-2xl p-6 text-center">
            <div class="text-3xl font-bold text-yellow-500" id="banned-users">0</div>
            <div class="text-gray-400">محظور</div>
        </div>
    </div>

    <!-- Users List -->
    <div class="bg-gray-800 rounded-2xl p-6">
        <h2 class="text-xl font-bold mb-6 text-blue-500"><i class="fas fa-users ml-2"></i>قائمة المستخدمين</h2>
        <div id="users-list" class="space-y-4">
            <!-- Users will be loaded here -->
        </div>
    </div>

    <!-- Add New Account Section -->
    <div class="mt-8 bg-gray-800 rounded-2xl p-6">
        <h2 class="text-xl font-bold mb-6 text-green-500"><i class="fas fa-user-plus ml-2"></i>إضافة حساب جديد</h2>
        <div class="grid md:grid-cols-3 gap-4">
            <input type="text" id="new-id" class="p-3 rounded-xl bg-gray-900 border border-gray-700" placeholder="معرف الكازينو">
            <input type="password" id="new-pass" class="p-3 rounded-xl bg-gray-900 border border-gray-700" placeholder="كلمة المرور">
            <button onclick="addUser()" class="py-3 bg-green-600 rounded-xl font-bold hover:bg-green-700">
                <i class="fas fa-plus ml-1"></i> إضافة
            </button>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div id="image-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
    <img id="modal-image" src="" class="max-w-full max-h-[90vh] rounded-2xl">
</div>

<script>
    let users = JSON.parse(localStorage.getItem('nasserusdt_users') || '[]');
    
    // Add some random fake accounts if empty
    if (users.length === 0) {
        const fakeUsers = [
            { id: 'user_' + Math.random().toString(36).substr(2, 8), password: 'pass123', casino: '1xBet', isActive: true, isBanned: false },
            { id: 'player_' + Math.random().toString(36).substr(2, 8), password: 'test456', casino: 'MelBet', isActive: false, isBanned: false },
            { id: 'gamer_' + Math.random().toString(36).substr(2, 8), password: 'game789', casino: 'LineBet', isActive: true, isBanned: true }
        ];
        users = fakeUsers;
        localStorage.setItem('nasserusdt_users', JSON.stringify(users));
    }

    function login() {
        const pass = document.getElementById('admin-password').value;
        if (pass === 'admin123') {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            renderUsers();
        } else {
            document.getElementById('error-msg').classList.remove('hidden');
        }
    }

    function logout() {
        document.getElementById('dashboard-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('admin-password').value = '';
    }

    function renderUsers() {
        const list = document.getElementById('users-list');
        list.innerHTML = '';
        
        const active = users.filter(u => u.isActive && !u.isBanned).length;
        const inactive = users.filter(u => !u.isActive && !u.isBanned).length;
        const banned = users.filter(u => u.isBanned).length;
        
        document.getElementById('total-users').textContent = users.length;
        document.getElementById('active-users').textContent = active;
        document.getElementById('inactive-users').textContent = inactive;
        document.getElementById('banned-users').textContent = banned;

        users.forEach((user, i) => {
            const statusClass = user.isBanned ? 'bg-yellow-500/20 text-yellow-500' : (user.isActive ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500');
            const statusText = user.isBanned ? 'محظور' : (user.isActive ? 'مفعّل' : 'غير مفعّل');
            
            list.innerHTML += `
                <div class="user-card bg-gray-900 rounded-xl p-4 card-hover transition-all" data-id="${user.id}">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold">
                                ${user.id.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div class="font-bold">${user.id}</div>
                                <div class="text-gray-400 text-sm">${user.casino || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 rounded-full text-sm ${statusClass}">${statusText}</span>
                            ${user.paymentProof ? `<button onclick="showImage('${user.paymentProof}')" class="px-3 py-1 bg-blue-600 rounded-lg text-sm"><i class="fas fa-image"></i></button>` : ''}
                            <button onclick="toggleActive(${i})" class="px-3 py-1 ${user.isActive ? 'bg-red-600' : 'bg-green-600'} rounded-lg text-sm">
                                ${user.isActive ? 'إلغاء التفعيل' : 'تفعيل'}
                            </button>
                            <button onclick="toggleBan(${i})" class="px-3 py-1 ${user.isBanned ? 'bg-green-600' : 'bg-yellow-600'} rounded-lg text-sm">
                                ${user.isBanned ? 'إلغاء الحظر' : 'حظر'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function toggleActive(index) {
        users[index].isActive = !users[index].isActive;
        localStorage.setItem('nasserusdt_users', JSON.stringify(users));
        renderUsers();
    }

    function toggleBan(index) {
        users[index].isBanned = !users[index].isBanned;
        localStorage.setItem('nasserusdt_users', JSON.stringify(users));
        renderUsers();
    }

    function showImage(src) {
        document.getElementById('modal-image').src = src;
        document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('image-modal').classList.add('hidden');
    }

    function filterUsers() {
        const query = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.user-card').forEach(card => {
            card.style.display = card.dataset.id.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function addUser() {
        const id = document.getElementById('new-id').value.trim();
        const pass = document.getElementById('new-pass').value.trim();
        if (id && pass) {
            users.push({ id, password: pass, casino: '1xBet', isActive: false, isBanned: false });
            localStorage.setItem('nasserusdt_users', JSON.stringify(users));
            document.getElementById('new-id').value = '';
            document.getElementById('new-pass').value = '';
            renderUsers();
        }
    }

    document.getElementById('admin-password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
</script>

</body> </html>
